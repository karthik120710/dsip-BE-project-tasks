version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsip-backend
    ports:
      - "8081:8080"
    environment:
      # Server
      SERVER_PORT: 8080
      COOKIE_SECURE: "false"  # Set to true in production with HTTPS

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dsip
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_POOL_SIZE: 10
      DB_POOL_MIN_IDLE: 5

      # JPA
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"

      # Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_REDIRECT_URI: http://localhost:8081/login/oauth2/code/google

      # OAuth2 Redirects
      OAUTH2_SUCCESS_REDIRECT_URL: http://localhost:3000/home
      OAUTH2_FAILURE_REDIRECT_URL: http://localhost:3000/auth/error
      OAUTH2_WHITELIST_FAILURE_REDIRECT_URL: http://localhost:3000/auth/unauthorized

      # Session
      SESSION_INACTIVITY_TIMEOUT_DAYS: 7
      SESSION_MAX_LIFETIME_DAYS: 60
      SESSION_MAX_AGE: 5184000

      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3000

      # Logging
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_APP: DEBUG
      LOG_LEVEL_SECURITY: INFO
      LOG_LEVEL_SESSION: INFO

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsip-network

  postgres:
    image: postgres:16-alpine
    container_name: dsip-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dsip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsip"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsip-network

volumes:
  postgres-data:

networks:
  dsip-network:
    driver: bridge
