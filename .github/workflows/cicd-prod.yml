name: CI/CD (prod)
on:
  push:
    branches: [main]

env:
  MANIFESTS_REPO: LimitLessJB/manifests
  MANIFEST_FILE_PATH: backend/deployment.yml
  IMAGE_TAG: limitlessjb/dsip-be

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}:${{ github.sha }}

      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPO }}
          token: ${{ secrets.PAT }}
          path: ops
      - name: Update image tag and push
        working-directory: ops
        run: |
          sed -i 's|image: ${{ env.IMAGE_TAG }}:.*|image: ${{ env.IMAGE_TAG }}:${{ github.sha }}|' ${{ env.MANIFEST_FILE_PATH }}
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add ${{ env.MANIFEST_FILE_PATH }}
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main
