server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: ${COOKIE_NAME:DSIP_SESSION}
        http-only: ${COOKIE_HTTP_ONLY:true}
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}
        max-age: ${SESSION_MAX_AGE:5184000}  # 60 days in seconds (2 months)

spring:
  application:
    name: dsip-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

# MyBatis Configuration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${OAUTH2_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dsip.backend
  type-handlers-package: com.dsip.backend.config
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Application-specific configuration
app:
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/auth/callback}
    failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:3000/auth/error}
    whitelist-failure-redirect-url: ${OAUTH2_WHITELIST_FAILURE_REDIRECT_URL:http://localhost:3000/auth/unauthorized}

  session:
    inactivity-timeout-days: ${SESSION_INACTIVITY_TIMEOUT_DAYS:7}
    max-lifetime-days: ${SESSION_MAX_LIFETIME_DAYS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Stock API Configuration
  finnhub:
    api-keys:
      - ${FINNHUB_API_KEY_1:}
      - ${FINNHUB_API_KEY_2:}
      - ${FINNHUB_API_KEY_3:}
      - ${FINNHUB_API_KEY_4:}
      - ${FINNHUB_API_KEY_5:}
      - ${FINNHUB_API_KEY_6:}
      - ${FINNHUB_API_KEY_7:}
      - ${FINNHUB_API_KEY_8:}
      - ${FINNHUB_API_KEY_9:}
      - ${FINNHUB_API_KEY_10:}

  upstox:
    access-token: ${UPSTOX_ACCESS_TOKEN:your-upstox-access-token}

  admin:
    api-key: ${ADMIN_API_KEY}

dsip:
  trading-days-per-year: ${DSIP_TRADING_DAYS_PER_YEAR:252}
  phase-count: ${DSIP_PHASE_COUNT:3}
  load-factor:
    gradual: ${DSIP_LOAD_FACTOR_GRADUAL:0.5,1.0,1.5}
    moderate: ${DSIP_LOAD_FACTOR_MODERATE:0.8,1.0,1.2}
    aggressive: ${DSIP_LOAD_FACTOR_AGGRESSIVE:1.0,1.0,1.0}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dsip.backend: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.session: ${LOG_LEVEL_SESSION:INFO}
