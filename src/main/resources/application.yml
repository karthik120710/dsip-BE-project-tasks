server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: DSIP_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        max-age: ${SESSION_MAX_AGE:5184000}  # 60 days in seconds (2 months)

spring:
  application:
    name: dsip-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${OAUTH2_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# Application-specific configuration
app:
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000}
    failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:3000/auth/error}
    whitelist-failure-redirect-url: ${OAUTH2_WHITELIST_FAILURE_REDIRECT_URL:http://localhost:3000/auth/unauthorized}

  session:
    inactivity-timeout-days: ${SESSION_INACTIVITY_TIMEOUT_DAYS:7}
    max-lifetime-days: ${SESSION_MAX_LIFETIME_DAYS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dsip.backend: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.session: ${LOG_LEVEL_SESSION:INFO}
