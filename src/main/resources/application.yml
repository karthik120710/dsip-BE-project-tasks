server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: ${COOKIE_NAME:DSIP_SESSION}
        http-only: ${COOKIE_HTTP_ONLY:true}
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}
        max-age: ${SESSION_MAX_AGE:5184000}  # 60 days in seconds (2 months)

spring:
  application:
    name: dsip-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# MyBatis Configuration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${OAUTH2_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dsip.backend
  type-handlers-package: com.dsip.backend.typehandler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Application-specific configuration
app:
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/auth/callback}
    failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:3000/auth/error}
    whitelist-failure-redirect-url: ${OAUTH2_WHITELIST_FAILURE_REDIRECT_URL:http://localhost:3000/auth/unauthorized}

  session:
    inactivity-timeout-days: ${SESSION_INACTIVITY_TIMEOUT_DAYS:7}
    max-lifetime-days: ${SESSION_MAX_LIFETIME_DAYS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Stock API Configuration
  finnhub:
    api-keys:
      - ${FINNHUB_API_KEY_1:}
      - ${FINNHUB_API_KEY_2:}
      - ${FINNHUB_API_KEY_3:}
      - ${FINNHUB_API_KEY_4:}
      - ${FINNHUB_API_KEY_5:}
      - ${FINNHUB_API_KEY_6:}
      - ${FINNHUB_API_KEY_7:}
      - ${FINNHUB_API_KEY_8:}
      - ${FINNHUB_API_KEY_9:}
      - ${FINNHUB_API_KEY_10:}

  upstox:
    access-token: ${UPSTOX_ACCESS_TOKEN:your-upstox-access-token}

  admin:
    api-key: ${ADMIN_API_KEY}

dsip:
  trading-days-per-year: ${DSIP_TRADING_DAYS_PER_YEAR:252}
  phase-count: ${DSIP_PHASE_COUNT:3}
  target-return-per-partition-percentage: ${DSIP_TARGET_RETURN:24}
  return-weight: ${DSIP_RETURN_WEIGHT:0.8}
  growth-weight: ${DSIP_GROWTH_WEIGHT:0.2}

  # Opportunity multiplier configuration
  avg-deviation-normalization-factor: ${DSIP_AVG_DEV_NORM:0.10}
  lock-in-normalization-factor: ${DSIP_LOCKIN_NORM:0.08}
  avg-deviation-weight: ${DSIP_AVG_DEV_WEIGHT:0.65}
  lock-in-weight: ${DSIP_LOCKIN_WEIGHT:0.35}
  opportunity-multiplier-min: ${DSIP_OPP_MULT_MIN:0.7}
  opportunity-multiplier-max-normal: ${DSIP_OPP_MULT_MAX:1.4}
  opportunity-multiplier-max-abnormal-dip: ${DSIP_OPP_MULT_MAX_DIP:2.0}

  # Contingency multiplier configuration
  contingency-multiplier-max: ${DSIP_CONT_MULT_MAX:1.1}
  contingency-multiplier-min: ${DSIP_CONT_MULT_MIN:0.7}
  contingency-decay-factor: ${DSIP_CONT_DECAY:0.4}

  # Lifecycle thresholds
  success-progress-threshold: ${DSIP_SUCCESS_PROGRESS:0.80}
  success-time-threshold: ${DSIP_SUCCESS_TIME:1.0}
  success-capital-threshold: ${DSIP_SUCCESS_CAPITAL:0.90}
  kill-return-threshold: ${DSIP_KILL_RETURN:-30.0}
  kill-time-threshold: ${DSIP_KILL_TIME:2.0}
  neutral-time-threshold: ${DSIP_NEUTRAL_TIME:1.5}

  # Load factor weights by deployment style
  load-factor:
    gradual: ${DSIP_LOAD_FACTOR_GRADUAL:0.33,0.33,0.33}
    moderate: ${DSIP_LOAD_FACTOR_MODERATE:0.42,0.33,0.24}
    aggressive: ${DSIP_LOAD_FACTOR_AGGRESSIVE:0.51,0.24,0.24}
    balanced: ${DSIP_LOAD_FACTOR_BALANCED:0.33,0.33,0.33}

  # Historical data generator configuration
  data:
    output-dir: ${DSIP_DATA_OUTPUT_DIR:./data/historical}
    default-period: ${DSIP_DATA_DEFAULT_PERIOD:3Y}
    yahoo-finance:
      timeout-seconds: ${DSIP_YAHOO_TIMEOUT:30}
      retry-count: ${DSIP_YAHOO_RETRY:3}
      retry-delay-ms: ${DSIP_YAHOO_RETRY_DELAY:1000}
      base-url: https://query1.finance.yahoo.com/v7/finance/download

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dsip.backend: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.session: ${LOG_LEVEL_SESSION:INFO}
